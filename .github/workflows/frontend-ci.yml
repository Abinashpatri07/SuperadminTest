name: Frontend CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: package-lock.json

    - name: Install Dependencies
      run: npm ci

    - name: Run Linter (Warnings only)
      run: npm run lint
      continue-on-error: true

    - name: Build Project
      run: npm run build
      env:
        VITE_API_URL: ${{ secrets.VITE_API_URL || 'https://api.dqnex.online' }}
